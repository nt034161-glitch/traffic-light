<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light</title>
    <style>
        

#traffic-light{
    background-color: black;
    height: 500px;
    width: 200px;
    margin-left: 600px;
    margin-top: 50px;
    border-radius: 25px;
    padding-top: 20px;

}

.red-light{
  height: 100px;
  width: 100px;
  background-color: red;
  border-radius: 50%;
  margin: 50px;
}
.yellow-light{
  height: 100px;
  width: 100px;
  background-color: yellow;
  border-radius: 50%;
  margin: 50px;
}
.green-light{
  height: 100px;
  width: 100px;
  background-color: darkgreen;
  border-radius: 50%;
  margin: 50px;
}

 .stand{
    height: 200px;
    width: 50px;
    margin: auto;
    background-color: black ;
    
    
} 
    </style>
    

</head>

<body>
    <div id="traffic-light">
          <div class="red-light"></div>
       <div class="yellow-light"></div>
        <div class="green-light"></div>
       <div class="stand"></div>
    </div>

</body>

</html>
